name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: brew install ninja
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^project(VirtualFM1 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFM1_COPY_PLUGIN=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Package
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: bash scripts/package-macos.sh build dist "${{ steps.v.outputs.version }}"
      - name: Install only the VST3 (choices work)
        run: |
          set -e
          cat > only-vst3.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><array>
            <dict><key>attributeSetting</key><integer>0</integer><key>choiceAttribute</key><string>selected</string><key>choiceIdentifier</key><string>app</string></dict>
            <dict><key>attributeSetting</key><integer>0</integer><key>choiceAttribute</key><string>selected</string><key>choiceIdentifier</key><string>au</string></dict>
          </array></plist>
          EOF
          sudo installer -pkg dist/*.pkg -target / -applyChoiceChangesXML only-vst3.plist
          test -d "/Library/Audio/Plug-Ins/VST3/Virtual FM-1.vst3" || { echo "VST3 missing"; exit 1; }
          test ! -e "/Library/Audio/Plug-Ins/Components/Virtual FM-1.component" || { echo "AU installed though not chosen"; exit 1; }
          test ! -e "/Applications/Virtual FM-1.app" || { echo "app installed though not chosen"; exit 1; }
          echo "only the VST3 was installed"
      - name: Install everything (the default choices)
        run: sudo installer -pkg dist/*.pkg -target /
      - name: Check the installed plugins and app
        run: |
          set -e
          for b in "/Library/Audio/Plug-Ins/VST3/Virtual FM-1.vst3" "/Library/Audio/Plug-Ins/Components/Virtual FM-1.component" "/Applications/Virtual FM-1.app"; do
            test -d "$b" || { echo "missing: $b"; exit 1; }
            lipo -info "$b/Contents/MacOS/Virtual FM-1"
            lipo "$b/Contents/MacOS/Virtual FM-1" -verify_arch arm64 x86_64
          done
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Fm1c Jscn | tee auval.txt
          grep -q "AU VALIDATION SUCCEEDED" auval.txt
          ./build/host_test_artefacts/Release/host_test "/Library/Audio/Plug-Ins/VST3/Virtual FM-1.vst3" 1
          ./build/host_test_artefacts/Release/host_test "/Library/Audio/Plug-Ins/Components/Virtual FM-1.component" 1
          "/Applications/Virtual FM-1.app/Contents/MacOS/Virtual FM-1" &
          PID=$!; sleep 10
          kill -0 $PID && echo "Standalone app is running"
          kill $PID
      - name: Notarize
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          PKG=$(ls dist/*.pkg)
          xcrun notarytool submit "$PKG" --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID" --wait
          xcrun stapler staple "$PKG"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*.pkg

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(sed -n 's/^project(VirtualFM1 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Toolchain
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -property installationVersion
          cmake --version
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DFM1_COPY_PLUGIN=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVersion=${{ steps.v.outputs.version }} "/DBuildDir=$PWD\build" "/DOutDir=$PWD\dist" scripts\installer.iss
      - name: Install, check, uninstall (as a user would, on the runner)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          $vst3 = "$env:CommonProgramFiles\VST3\Virtual FM-1.vst3"
          $app = "$env:ProgramFiles\Virtual FM-1\Virtual FM-1.exe"
          # only the VST3 first: the choices work
          $p = Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/COMPONENTS=vst3','/LOG=install-vst3.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install-vst3.log; throw "installer exited with $($p.ExitCode)" }
          if (!(Test-Path "$vst3\Contents\x86_64-win\Virtual FM-1.vst3")) { throw "VST3 not installed" }
          if (Test-Path $app) { throw "app installed though not chosen" }
          Write-Host "only the VST3 was installed"
          $p = Start-Process "$env:ProgramFiles\Virtual FM-1\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          # then everything (the default)
          $p = Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "installer exited with $($p.ExitCode)" }
          if (!(Test-Path "$vst3\Contents\x86_64-win\Virtual FM-1.vst3")) { throw "VST3 not installed at $vst3" }
          if (!(Test-Path $app)) { throw "app not installed at $app" }
          Write-Host "installed: $vst3 and $app"
          & build\host_test_artefacts\Release\host_test.exe $vst3 1
          if ($LASTEXITCODE -ne 0) { throw "host_test failed on the installed VST3 ($LASTEXITCODE)" }
          $sa = Start-Process $app -PassThru
          Start-Sleep -Seconds 10
          if ($sa.HasExited) { throw "the Standalone app exited with $($sa.ExitCode)" }
          Write-Host "Standalone app is running"
          Stop-Process -Id $sa.Id
          $un = Start-Process "$env:ProgramFiles\Virtual FM-1\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          if ((Test-Path "$vst3\Contents") -or (Test-Path $app)) { throw "uninstall left files behind" }
          Write-Host "uninstalled cleanly"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^project(VirtualFM1 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Tools and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build xvfb fluxbox \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFM1_COPY_PLUGIN=OFF
      - name: Build
        run: cmake --build build
      - name: Display for the host test
        # the editor needs an X display with a window manager (without one, X refuses some window properties)
        run: |
          setsid Xvfb :99 -ac -screen 0 1280x1024x24 </dev/null >/dev/null 2>&1 &
          sleep 2
          DISPLAY=:99 setsid fluxbox </dev/null >/dev/null 2>&1 &
          sleep 2
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Test
        run: ctest --test-dir build --timeout 120 --output-on-failure
      - name: Package
        run: scripts/package-linux.sh build dist ${{ steps.v.outputs.version }}
      - name: Install, check, uninstall (as a user, then system-wide)
        run: |
          scripts/check-linux-package.sh dist/*.tar.gz build/host_test_artefacts/Release/host_test
          sudo DISPLAY=:99 scripts/check-linux-package.sh dist/*.tar.gz build/host_test_artefacts/Release/host_test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          # the lines under "## [<version>]", up to the next "## [" heading, each
          # entry joined onto one line: GitHub shows a release's line breaks as breaks
          awk -v v="$v" '/^## \[/ { p = index($0, "[" v "]") > 0; next } /^\[[^]]*\]: / { next } p' CHANGELOG.md |
            awk 'function flush() { if (buf != "") print buf; buf = "" }
                 /^[[:space:]]*$/ { flush(); print ""; next }
                 /^#/ || /^- / { flush(); buf = $0; next }
                 { line = $0; sub(/^[[:space:]]+/, "", line); buf = (buf == "" ? line : buf " " line) }
                 END { flush() }' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "CHANGELOG.md has no section for $v"; exit 1; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos-installer/*.pkg
            dist/windows-installer/*.exe
            dist/linux-package/*.tar.gz
          body_path: notes.md
          draft: true          # published by hand from the Releases page
